# VideoSeek default configuration

paths:
  data_dir: data            # frames, audio, transcripts, ocr, indexes live below this
  logs_dir: logs            # per-run logs (gitignored)

video:
  sample_fps: 1.0          # frames per second for visual indexing
  keyframe_fps: 0.5        # keyframes for OCR and captions
  thumb_width: 320

frames:
  model: google/siglip-base-patch16-224
  batch_size: 32
  device: auto             # auto | cuda | cpu

objects:
  model: yolo11n.pt
  tracker: bytetrack.yaml
  conf: 0.35
  classes: [0, 1, 2, 3, 5, 7, 24, 26, 28]   # person, bicycle, car, motorcycle, bus, truck, backpack, handbag, suitcase
  min_crop_px: 32
  max_crops_per_track: 3
  max_segment_s: 12.0      # split long-lived track ids into retrieval-friendly segments
  max_gap_s: 2.5           # split when a track disappears for longer than this
  anchor_interval_s: 2.0   # add top detections at this interval, independent of track ids
  anchor_max_per_frame: 3
  crop_margin: 0.1
  max_crops_per_video: 2000
  device: auto

captions:
  enabled: false
  model: Qwen/Qwen2.5-VL-3B-Instruct
  load_in_4bit: true
  max_keyframes: 300

speech:
  enabled: true
  model: small
  language: null           # null = auto-detect; set "en" to force English
  beam_size: 5
  word_timestamps: true
  vad_filter: true
  chunk_seconds: 30
  overlap_seconds: 5
  compute_type: auto       # auto | float16 | int8
  device: auto

ocr:
  enabled: true
  lang: en
  min_confidence: 0.5
  dedupe_similarity: 0.9
  enable_mkldnn: false     # Paddle 3.x oneDNN crashes on this Windows build
  text_detection_model_name: PP-OCRv5_mobile_det   # mobile = ~5x faster on CPU
  text_recognition_model_name: PP-OCRv5_mobile_rec
  text_det_limit_side_len: 640
  text_det_limit_type: max
  text_recognition_batch_size: 8
  allow_non_ascii: false   # English-first; drops Chinese/gibberish misreads
  keyframe_min_interval_s: 2.0
  keyframe_max_interval_s: 15.0
  scene_threshold: 0.08
  blank_std_threshold: 0.01
  max_keyframes: 0         # 0 = unlimited
  max_gap_s: 16.0          # max time a slide's text is assumed to persist

text:
  embedding_model: BAAI/bge-small-en-v1.5
  use_bm25: true
  query_prefix: true       # BGE retrieval instruction for queries
  batch_size: 32
  device: auto

search:
  top_k: 20
  rrf_k: 60
  rrf_window_s: 2.0
  merge_gap_s: 3.0
  min_segment_s: 1.0
  route_speech: true       # speech queries use the transcript layer, not RRF
  route_ocr: false         # fuse frames + OCR for OCR queries (visual context helps)
  rerank_top_n: 3
  weights:
    frame: 1.0
    object: 1.0
    speech: 1.2
    ocr: 1.2
    caption: 0.6
